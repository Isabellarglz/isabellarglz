<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- TECH STACK (70%) -->
  <rect x="1" y="1" width="614" height="218" rx="16" ry="16" fill="none" stroke="#9BA3AE" stroke-width="2"/>
  <text x="308" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#ffffff" stroke="#000000" stroke-width="0.75" stroke-linejoin="round" paint-order="stroke fill">TECH STACK</text>
  <image href="./tech-stack.png" xlink:href="./tech-stack.png" x="48" y="58" width="520" height="140" preserveAspectRatio="xMidYMid meet"/>
 
  <!-- Creative Stack (30%) -->
  <rect x="635" y="1" width="264" height="218" rx="16" ry="16" fill="none" stroke="#9BA3AE" stroke-width="2"/>
  <text x="767" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#ffffff" stroke="#000000" stroke-width="0.75" stroke-linejoin="round" paint-order="stroke fill">CREATIVE STACK</text>
  <image href="./creative-stack.png" xlink:href="./creative-stack.png" x="675" y="58" width="184" height="140" preserveAspectRatio="xMidYMid meet"/>
</svg>